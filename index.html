<!doctype html><html lang='de'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TV Sorter AI</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}.wrap{max-width:600px;margin:auto;padding:28px 18px}.card{background:white;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #0001}h1{font-size:32px}.muted{color:#666}select,input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:8px;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#111;color:white;border:0;font-weight:700}.result{display:none}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.ok{color:#16803c;font-weight:700}</style><div class='wrap'><h1>TV Sorter AI</h1><p class='muted'>Senderliste automatisch analysieren und richtig sortieren.</p><div class='card'><label>TV-Hersteller</label><select id='brand'><option>Samsung</option><option>LG</option><option>Sony</option><option>Philips</option></select><label>Empfang</label><select id='type'><option>Vodafone Kabel</option><option>Satellit</option><option>DVB-T2</option></select><label>Aktueller Platz von Das Erste</label><input id='pos' type='number' value='58'><button id='analyze'>Problem analysieren</button></div><div class='card result' id='result'><h2>Analyse</h2><p class='ok'>Problem erkannt</p><div id='rows'></div><button id='guide'>Anleitung anzeigen</button></div></div><script>const channels=['Das Erste HD','ZDF HD','RTL HD','SAT.1 HD','ProSieben HD','VOX HD','Kabel Eins HD','RTL Zwei HD','3sat HD','arte HD'];document.getElementById('analyze').onclick=()=>{let p=+document.getElementById('pos').value||58;document.getElementById('rows').innerHTML=channels.map((c,i)=>`<div class='row'><span>${c}</span><span>${c==='Das Erste HD'?p:'—'} → <b>${i+1}</b></span></div>`).join('');document.getElementById('result').style.display='block'};document.getElementById('guide').onclick=()=>alert('Samsung: Einstellungen → Senderempfang → Sendersuchlauf → Kabel → Netzwerk. Danach Senderliste prüfen und sortieren.');</script></html>
